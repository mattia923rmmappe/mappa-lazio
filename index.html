<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ArcheoLazio PRO - LiDAR Fix</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    
    <style>
        body { margin: 0; padding: 0; background: #222; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Aumentiamo il contrasto del LiDAR tramite CSS */
        .lidar-layer {
            filter: contrast(150%) brightness(90%) grayscale(100%);
            mix-blend-mode: multiply; /* Questo fonde le ombre del LiDAR con i colori del satellite */
        }

        #info-box {
            position: absolute; bottom: 40px; left: 10px; z-index: 1000;
            background: rgba(0,0,0,0.8); color: #00ff00; padding: 8px;
            border-radius: 5px; font-size: 13px; border: 1px solid #444;
            font-family: monospace; pointer-events: none;
        }

        .gps-btn {
            position: absolute; bottom: 35px; right: 20px; z-index: 1000;
            background: white; width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 28px; border: 2px solid #007bff;
        }

        #status {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 2000; background: red; color: white; padding: 8px 15px;
            border-radius: 20px; display: none; font-weight: bold;
        }

        .user-arrow { transition: transform 0.1s linear; }
    </style>
</head>
<body>

    <div id="status">⚠️ AREA ARCHEOLOGICA</div>
    <div id="info-box">ZOOM: 11<br>DIST: 0 m</div>
    <div id="map"></div>
    <div class="gps-btn" onclick="trovaPosizione()">📍</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script>
        var map = L.map('map', { center: [41.9028, 12.4964], zoom: 11, zoomControl: false });
        L.control.zoom({ position: 'topleft' }).addTo(map);
        L.control.scale({ imperial: false }).addTo(map);

        // 1. BASE: SATELLITE
        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { 
            maxZoom: 19 
        }).addTo(map);

        // 2. LIDAR / HILLSHADE (Nuovo server più contrastato)
        var lidarContrast = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            opacity: 0.5,
            className: 'lidar-layer' // Applica il filtro CSS
        });

        // 3. OVERLAYS
        var labels = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { subdomains: 'abcd' }).addTo(map);
        
        var wmsLazio = 'https://geoportale.regione.lazio.it/geoserver/wms';
        var areeArcheo = L.tileLayer.wms(wmsLazio, { 
            layers: 'geonode:aree_archeologiche', format: 'image/png', transparent: true, opacity: 0.5 
        }).addTo(map);

        // Menu Livelli (LiDAR ora è un Overlay da accendere sopra il satellite)
        var overlays = { 
            "⛰️ LiDAR Alta Visibilità": lidarContrast,
            "🏛️ Aree Archeo": areeArcheo, 
            "🏷️ Nomi Vie": labels 
        };
        L.control.layers(null, overlays, { collapsed: false }).addTo(map);

        // --- SISTEMA GPS E TRACKING ---
        var totalDist = 0, lastPos = null;
        var trackLine = L.polyline([], {color: '#00ff00', weight: 3}).addTo(map);
        var userMarker, userCircle;

        var arrowIcon = L.divIcon({
            className: 'user-arrow',
            html: '<svg width="30" height="30" viewBox="0 0 100 100"><path d="M50 0 L90 100 L50 75 L10 100 Z" fill="#007bff" stroke="white" stroke-width="4"/></svg>',
            iconSize: [30, 30], iconAnchor: [15, 15]
        });

        function updateInfo() {
            document.getElementById('info-box').innerHTML = "ZOOM: " + map.getZoom() + "<br>DIST: " + (totalDist > 1000 ? (totalDist/1000).toFixed(2) + " km" : Math.round(totalDist) + " m");
        }
        map.on('zoomend', updateInfo);

        function trovaPosizione() {
            map.locate({setView: true, maxZoom: 18, enableHighAccuracy: true, watch: true});
        }

        window.addEventListener('deviceorientationabsolute', function(e) {
            var alpha = e.alpha || e.webkitCompassHeading;
            if (alpha !== null && userMarker) {
                var el = userMarker.getElement();
                if (el) el.style.transform = el.style.transform.replace(/rotateZ\(.*?\)/, '') + ' rotateZ(' + (360 - alpha) + 'deg)';
            }
        }, true);

        map.on('locationfound', function(e) {
            if (userMarker) {
                userMarker.setLatLng(e.latlng);
                userCircle.setLatLng(e.latlng).setRadius(e.accuracy / 2);
                if (lastPos && e.accuracy < 20) {
                    var d = lastPos.distanceTo(e.latlng);
                    if (d > 5) { totalDist += d; trackLine.addLatLng(e.latlng); updateInfo(); }
                }
            } else {
                userCircle = L.circle(e.latlng, {radius: e.accuracy / 2, color: '#007bff', opacity: 0.3}).addTo(map);
                userMarker = L.marker(e.latlng, {icon: arrowIcon}).addTo(map);
            }
            lastPos = e.latlng;
            
            if (window.alertOn) {
                var url = wmsLazio + "?service=WMS&request=GetFeatureInfo&version=1.1.1&layers=geonode:aree_archeologiche&query_layers=geonode:aree_archeologiche&info_format=application/json&x=50&y=50&width=101&height=101&bbox=" + (e.latlng.lng-0.01)+","+(e.latlng.lat-0.01)+","+(e.latlng.lng+0.01)+","+(e.latlng.lat+0.01);
                fetch(url).then(r => r.json()).then(d => { document.getElementById('status').style.display = (d.features && d.features.length > 0) ? 'block' : 'none'; });
            }
        });

        window.alertOn = false;
        var Gui = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                var c = L.DomUtil.create('div', 'leaflet-bar');
                c.style.background = "white";
                c.innerHTML = '<div id="tA" style="padding:10px; cursor:pointer; border-bottom:1px solid #ccc; color:red; font-weight:bold;">🔔 Allerta: OFF</div><div id="tR" style="padding:10px; cursor:pointer;">🧹 Reset Traccia</div>';
                c.querySelector('#tA').onclick = function() { window.alertOn = !window.alertOn; this.innerHTML = window.alertOn ? "🔔 Allerta: ON" : "🔔 Allerta: OFF"; this.style.color = window.alertOn ? "green" : "red"; };
                c.querySelector('#tR').onclick = function() { if(confirm("Resettare i metri fatti?")) { totalDist = 0; trackLine.setLatLngs([]); updateInfo(); } };
                return c;
            }
        });
        map.addControl(new Gui());
        map.pm.addControls({ position: 'topleft', drawMarker: false });
    </script>
</body>
</html>
