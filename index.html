<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ArcheoMap - Vie & Scala</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; }
        
        /* Box Info in basso */
        #info-box {
            position: absolute; bottom: 50px; left: 10px; z-index: 1000;
            background: rgba(0,0,0,0.8); color: #ffff00; padding: 10px;
            border-radius: 8px; font-size: 13px; border: 2px solid #ffff00;
            font-family: monospace; pointer-events: none;
        }

        /* Pannello Controlli a destra */
        .control-panel {
            position: absolute; top: 10px; right: 10px; z-index: 2000;
            background: white; padding: 5px; border-radius: 8px; border: 2px solid #333;
            width: 160px;
        }
        .control-item {
            padding: 10px; border-bottom: 1px solid #eee; cursor: pointer;
            font-weight: bold; font-size: 11px; display: flex; justify-content: space-between; align-items: center;
        }
        
        /* Tasti specifici */
        .map-switch { background: #4285F4 !important; color: white !important; margin-bottom: 5px; border-radius: 4px; }
        .osm-switch { background: #333 !important; color: white !important; margin-bottom: 5px; border-radius: 4px; }

        .gps-btn {
            position: absolute; bottom: 50px; right: 20px; z-index: 1000;
            background: white; width: 55px; height: 55px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 24px; border: 2px solid #ffff00;
        }
        
        /* Stile barra scala (modifica Leaflet standard) */
        .leaflet-control-scale-line {
            border: 2px solid #333;
            background: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: bold;
            padding: 2px;
        }
    </style>
</head>
<body>

    <div id="info-box">
        MISURA: <span id="val-dist">0</span> m<br>
        ZOOM: <span id="val-zoom">15</span>
    </div>

    <div class="control-panel">
        <div class="control-item map-switch" onclick="switchBaseMap()" id="btn-map-type">🗺️ SATELLITE + VIE</div>
        <div class="control-item osm-switch" onclick="useOSM()" id="btn-osm">🌍 SOLO STRADE</div>
        
        <div class="control-item" onclick="toggleLayer('arch')" id="btn-arch" style="color: red;">
            🏛️ VINCOLI: <span>ON</span>
        </div>
        
        <div class="control-item" onclick="toggleLayer('ptpr')" id="btn-ptpr" style="color: orange;">
            🟧 PTPR: <span>ON</span>
        </div>
        
        <div class="control-item" onclick="resetMisura()" style="background: #f0f0f0;">
            📏 RESET
        </div>
    </div>
    
    <div id="map"></div>
    <div class="gps-btn" onclick="attivaGps()">📍</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script>
        var map = L.map('map', { center: [41.9028, 12.4964], zoom: 15, zoomControl: false });

        // --- 1. BARRA DEI METRI (SCALA) ---
        // Questa appare in basso a sinistra e cambia coi metri
        L.control.scale({
            position: 'bottomleft', 
            imperial: false, 
            metric: true, 
            maxWidth: 200
        }).addTo(map);

        // Aggiorna indicatore zoom
        map.on('zoomend', function() {
            document.getElementById('val-zoom').innerText = map.getZoom();
        });

        // --- 2. SFONDI ---
        // Google Hybrid (Satellite + Nomi Vie)
        var googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'] });
        // Google Terrain (Rilievi + Nomi)
        var googleTerrain = L.tileLayer('https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'] });
        // OpenStreetMap (Solo Strade - Migliore per i nomi)
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });

        googleHybrid.addTo(map); // Partiamo col satellite ibrido
        var currentBase = "sat";

        function switchBaseMap() {
            if(map.hasLayer(osmLayer)) map.removeLayer(osmLayer); // Rimuove OSM se c'era
            
            if (currentBase === "sat") {
                map.removeLayer(googleHybrid);
                googleTerrain.addTo(map);
                currentBase = "terrain";
                document.getElementById('btn-map-type').innerHTML = "⛰️ TERRENO";
            } else {
                map.removeLayer(googleTerrain);
                googleHybrid.addTo(map);
                currentBase = "sat";
                document.getElementById('btn-map-type').innerHTML = "🗺️ SATELLITE";
            }
        }

        function useOSM() {
            // Rimuove gli altri sfondi
            if(map.hasLayer(googleHybrid)) map.removeLayer(googleHybrid);
            if(map.hasLayer(googleTerrain)) map.removeLayer(googleTerrain);
            osmLayer.addTo(map);
            currentBase = "osm";
            document.getElementById('btn-map-type').innerHTML = "🔙 TORNA A SAT";
        }

        // --- 3. LAYERS REGIONE (Configurazione Stabile) ---
        var wmsUrl = 'https://geoportale.regione.lazio.it/geoserver/wms';

        var layerArch = L.tileLayer.wms(wmsUrl, {
            layers: 'geonode:aree_archeologiche',
            format: 'image/png', transparent: true, version: '1.1.1', opacity: 0.7, zIndex: 500
        }).addTo(map);

        var layerPtpr = L.tileLayer.wms(wmsUrl, {
            layers: 'geonode:ptpr_tavole_a_beni_paesaggistici',
            format: 'image/png', transparent: true, version: '1.1.1', opacity: 0.6, zIndex: 400
        }).addTo(map);

        function toggleLayer(type) {
            var ly, btn;
            if(type === 'arch') { ly = layerArch; btn = 'btn-arch'; }
            if(type === 'ptpr') { ly = layerPtpr; btn = 'btn-ptpr'; }

            if(map.hasLayer(ly)) {
                map.removeLayer(ly);
                document.getElementById(btn).style.opacity = "0.4";
                document.getElementById(btn).querySelector('span').innerText = "OFF";
            } else {
                map.addLayer(ly);
                document.getElementById(btn).style.opacity = "1";
                document.getElementById(btn).querySelector('span').innerText = "ON";
            }
        }

        // --- 4. GOOGLE MAPS LINK ---
        map.on('click', function(e) {
            var lat = e.latlng.lat.toFixed(6);
            var lng = e.latlng.lng.toFixed(6);
            L.popup().setLatLng(e.latlng).setContent(`<div style="text-align:center;"><a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" style="background:#4285F4;color:white;padding:10px;border-radius:5px;text-decoration:none;font-weight:bold;">🧭 APRI GOOGLE MAPS</a></div>`).openOn(map);
        });

        // --- 5. DISEGNO ---
        map.pm.addControls({ position: 'topleft', drawMarker: false, drawPolyline: true, removalMode: true });
        map.pm.setPathOptions({ color: '#FFFF00', weight: 6 });

        map.on('pm:create', function(e) {
            if (e.layer instanceof L.Polyline) {
                var pts = e.layer.getLatLngs();
                var dist = 0;
                for(var i=0; i<pts.length-1; i++) dist += pts[i].distanceTo(pts[i+1]);
                document.getElementById('val-dist').innerText = Math.round(dist);
            }
        });

        function resetMisura() {
            map.eachLayer(function(l) { if(l instanceof L.Polyline && l !== layerArch && l !== layerPtpr) map.removeLayer(l); });
            document.getElementById('val-dist').innerText = "0";
        }

        // --- 6. GPS ---
        function attivaGps() { map.locate({setView:true, maxZoom:17, enableHighAccuracy:true}); }
        map.on('locationfound', function(e) {
            L.marker(e.latlng, {icon:L.divIcon({className:'',html:'<div style="width:20px;height:20px;background:yellow;border:3px solid white;border-radius:50%;box-shadow:0 0 5px black;"></div>'})}).addTo(map);
        });
    </script>
</body>
</html>
