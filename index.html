<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ArcheoLazio Interactive PRO</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; }
        
        #info-box {
            position: absolute; bottom: 40px; left: 10px; z-index: 1000;
            background: rgba(0,0,0,0.85); color: #00ff00; padding: 12px;
            border-radius: 8px; font-size: 14px; border: 1px solid #00ff00;
            font-family: 'Courier New', monospace; pointer-events: none;
        }

        .gps-btn {
            position: absolute; bottom: 35px; right: 20px; z-index: 1000;
            background: white; width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 30px; border: 3px solid #007bff;
        }

        #alert-container {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 2000; width: 90%; max-width: 400px; pointer-events: none;
        }
        .alert-box {
            padding: 12px; border-radius: 10px; text-align: center; 
            font-weight: bold; color: white; display: none; margin-bottom: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 2px solid white;
        }
        #alert-archeo { background: #ff0000; }
        #alert-parchi { background: #004cff; }

        .detector-icon { transition: transform 0.1s linear; }
        
        /* Stile popup migliorato */
        .popup-btn {
            display: block; width: 100%; margin-top: 5px; padding: 8px;
            border: none; border-radius: 4px; font-weight: bold; color: white;
            cursor: pointer; text-decoration: none; text-align: center;
        }
    </style>
</head>
<body>

    <div id="alert-container">
        <div id="alert-archeo" class="alert-box">⚠️ AREA ARCHEOLOGICA</div>
        <div id="alert-parchi" class="alert-box">🌳 PARCO PROTETTO</div>
    </div>

    <div id="info-box">ZOOM: 11<br>DIST: 0 m</div>
    
    <div id="map"></div>
    <div class="gps-btn" onclick="trovaPosizione()">📍</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script>
        var map = L.map('map', { center: [41.9028, 12.4964], zoom: 11, zoomControl: false });

        // LIVELLI
        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
        var labels = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { subdomains: 'abcd' }).addTo(map);
        
        var wmsLazio = 'https://geoportale.regione.lazio.it/geoserver/wms';
        var areeArcheo = L.tileLayer.wms(wmsLazio, { layers: 'geonode:aree_archeologiche', format: 'image/png', transparent: true, opacity: 0.5 }).addTo(map);
        var parchi = L.tileLayer.wms(wmsLazio, { layers: 'geonode:ps_amb_aree_protette', format: 'image/png', transparent: true, opacity: 0.5 }).addTo(map);

        L.control.layers(null, { "🏛️ Archeo": areeArcheo, "🔵 Parchi": parchi, "🏷️ Nomi": labels }, { collapsed: false }).addTo(map);

        // --- DISEGNO E NAVIGAZIONE ---
        map.pm.addControls({ position: 'topleft', drawMarker: true, drawPolyline: true, removalMode: true });
        map.pm.setLang('it');

        map.on('pm:create', function(e) {
            var layer = e.layer;
            if (layer instanceof L.Marker) {
                var p = layer.getLatLng();
                var btn = `<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking" target="_blank" class="popup-btn" style="background:#007bff;">🧭 VAI QUI</a>`;
                layer.bindPopup("<b>Punto Segnato</b>" + btn).openPopup();
            }
        });

        // --- FUNZIONE INFO STORICHE E FOTO ---
        map.on('click', function(e) {
            var size = map.getSize();
            var point = map.layerPointToContainerPoint(e.layerPoint);
            var bbox = map.getBounds().toBBoxString();

            var url = wmsLazio + "?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo&LAYERS=geonode:aree_archeologiche&QUERY_LAYERS=geonode:aree_archeologiche&INFO_FORMAT=application/json&X=" + Math.round(point.x) + "&Y=" + Math.round(point.y) + "&WIDTH=" + size.x + "&HEIGHT=" + size.y + "&BBOX=" + bbox;

            fetch(url).then(res => res.json()).then(data => {
                if (data.features && data.features.length > 0) {
                    var props = data.features[0].properties;
                    var nome = props.nome_sito || "Sito Archeologico";
                    var crono = props.cronologia || "Epoca non specificata";
                    
                    var popupHtml = `
                        <div style="min-width:180px">
                            <b style="color:#d32f2f">🏛️ ${nome}</b><br>
                            <small><b>Cronologia:</b> ${crono}</small><br>
                            <hr>
                            <a href="https://www.google.com/search?tbm=isch&q=reperti+archeologici+${encodeURIComponent(nome)}" target="_blank" class="popup-btn" style="background:#f39c12;">🖼️ VEDI FOTO REPERTI</a>
                            <a href="https://www.google.com/search?q=${encodeURIComponent(nome)}+storia+archeologia" target="_blank" class="popup-btn" style="background:#555;">📖 LEGGI STORIA</a>
                        </div>
                    `;
                    L.popup().setLatLng(e.latlng).setContent(popupHtml).openOn(map);
                }
            });
        });

        // --- GPS E ICONA DETECTOR ---
        var totalDist = 0, lastPos = null;
        var trackLine = L.polyline([], {color: '#00ff00', weight: 4}).addTo(map);
        var userMarker, userCircle;

        var detectorIcon = L.divIcon({
            className: 'detector-icon',
            html: `<svg width="40" height="40" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="#fbff00" stroke-width="6" fill="rgba(251, 255, 0, 0.2)" /><line x1="50" y1="10" x2="50" y2="90" stroke="#fbff00" stroke-width="4" /><line x1="10" y1="50" x2="90" y2="50" stroke="#fbff00" stroke-width="4" /><circle cx="50" cy="50" r="5" fill="#fbff00" /><path d="M50 5 L60 20 L40 20 Z" fill="#fbff00" /></svg>`,
            iconSize: [40, 40], iconAnchor: [20, 20]
        });

        function updateUI() {
            var dLabel = totalDist > 1000 ? (totalDist/1000).toFixed(2) + " km" : Math.round(totalDist) + " m";
            document.getElementById('info-box').innerHTML = "ZOOM: " + map.getZoom() + "<br>DIST: " + dLabel;
        }
        map.on('zoomend', updateUI);

        function trovaPosizione() {
            map.locate({setView: true, maxZoom: 18, enableHighAccuracy: true, watch: true});
        }

        window.addEventListener('deviceorientationabsolute', function(e) {
            var alpha = e.alpha || e.webkitCompassHeading;
            if (alpha !== null && userMarker) {
                var el = userMarker.getElement();
                if (el) el.style.transform = el.style.transform.replace(/rotateZ\(.*?\)/, '') + ' rotateZ(' + (360 - alpha) + 'deg)';
            }
        }, true);

        map.on('locationfound', function(e) {
            if (userMarker) {
                userMarker.setLatLng(e.latlng);
                userCircle.setLatLng(e.latlng).setRadius(e.accuracy / 2);
                if (lastPos && e.accuracy < 25) {
                    var d = lastPos.distanceTo(e.latlng);
                    if (d > 4) { totalDist += d; trackLine.addLatLng(e.latlng); }
                }
            } else {
                userCircle = L.circle(e.latlng, {radius: e.accuracy / 2, color: '#007bff', opacity: 0.2}).addTo(map);
                userMarker = L.marker(e.latlng, {icon: detectorIcon}).addTo(map);
            }
            lastPos = e.latlng;
            updateUI();

            if (window.alertOn) {
                checkAlert(e.latlng, 'geonode:aree_archeologiche', 'alert-archeo');
                checkAlert(e.latlng, 'geonode:ps_amb_aree_protette', 'alert-parchi');
            }
        });

        function checkAlert(latlng, layer, elementId) {
            var b = 0.0003; 
            var url = wmsLazio + "?service=WMS&request=GetFeatureInfo&version=1.1.1&layers=" + layer + "&query_layers=" + layer + "&info_format=application/json&x=50&y=50&width=101&height=101&bbox=" + (latlng.lng-b)+","+(latlng.lat-b)+","+(latlng.lng+b)+","+(latlng.lat+b);
            fetch(url).then(r => r.json()).then(d => { 
                document.getElementById(elementId).style.display = (d.features && d.features.length > 0) ? 'block' : 'none';
            }).catch(e => {});
        }

        window.alertOn = false;
        var Gui = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                var c = L.DomUtil.create('div', 'leaflet-bar');
                c.style.background = "white";
                c.innerHTML = '<div id="tA" style="padding:12px; cursor:pointer; border-bottom:1px solid #ccc; color:red; font-weight:bold;">🔔 Allerta: OFF</div><div id="tR" style="padding:12px; cursor:pointer;">🧹 Reset</div>';
                c.querySelector('#tA').onclick = function() { 
                    window.alertOn = !window.alertOn; 
                    this.innerHTML = window.alertOn ? "🔔 Allerta: ON" : "🔔 Allerta: OFF"; 
                    this.style.color = window.alertOn ? "green" : "red";
                };
                c.querySelector('#tR').onclick = function() { totalDist = 0; trackLine.setLatLngs([]); updateUI(); };
                return c;
            }
        });
        map.addControl(new Gui());
    </script>
</body>
</html>
