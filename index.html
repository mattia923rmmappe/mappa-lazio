<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ArcheoLazio PRO - Fix Info</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Box Metri e Zoom - RIPRISTINATO */
        #info-box {
            position: absolute; bottom: 40px; left: 10px; z-index: 1000;
            background: rgba(0,0,0,0.85); color: #00ff00; padding: 10px;
            border-radius: 5px; font-size: 14px; border: 1px solid #444; 
            font-family: monospace; line-height: 1.5; pointer-events: none;
        }

        .gps-btn {
            position: absolute; bottom: 35px; right: 20px; z-index: 1000;
            background: white; width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 30px; border: 3px solid #007bff;
        }

        #alert-container {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 2000; width: 90%; max-width: 400px; pointer-events: none;
        }
        .alert-box {
            padding: 12px; border-radius: 10px; text-align: center; 
            font-weight: bold; color: white; display: none; margin-bottom: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 2px solid white;
        }
        #alert-archeo { background: #ff0000; }
        #alert-parchi { background: #004cff; }
        .user-arrow { transition: transform 0.1s linear; }
    </style>
</head>
<body>

    <div id="alert-container">
        <div id="alert-archeo" class="alert-box">⚠️ AREA ARCHEOLOGICA</div>
        <div id="alert-parchi" class="alert-box">🌳 PARCO / AREA PROTETTA</div>
    </div>

    <div id="info-box">ZOOM: 11<br>DIST: 0 m</div>
    
    <div id="map"></div>
    <div class="gps-btn" onclick="trovaPosizione()">📍</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        var map = L.map('map', { center: [41.9028, 12.4964], zoom: 11, zoomControl: false });

        // LIVELLI
        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
        var lidarFast = L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_terrain_background/{z}/{x}/{y}{r}.png', { maxZoom: 18, opacity: 0.6 });
        var labels = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { subdomains: 'abcd' }).addTo(map);
        
        var wmsLazio = 'https://geoportale.regione.lazio.it/geoserver/wms';
        var areeArcheo = L.tileLayer.wms(wmsLazio, { layers: 'geonode:aree_archeologiche', format: 'image/png', transparent: true, opacity: 0.5 }).addTo(map);
        var parchi = L.tileLayer.wms(wmsLazio, { layers: 'geonode:ps_amb_aree_protette', format: 'image/png', transparent: true, opacity: 0.5 });

        L.control.layers(null, { 
            "⛰️ LiDAR / Rilievo": lidarFast,
            "🏛️ Archeo (Rosso)": areeArcheo, 
            "🔵 Parchi (Blu)": parchi,
            "🏷️ Nomi": labels 
        }, { collapsed: false }).addTo(map);

        // VARIABILI GPS
        var totalDist = 0, lastPos = null;
        var trackLine = L.polyline([], {color: '#00ff00', weight: 4}).addTo(map);
        var userMarker, userCircle;

        // FUNZIONE AGGIORNAMENTO TESTO
        function updateUI() {
            var zoom = map.getZoom();
            var distLabel = totalDist > 1000 ? (totalDist/1000).toFixed(2) + " km" : Math.round(totalDist) + " m";
            document.getElementById('info-box').innerHTML = "ZOOM: " + zoom + "<br>DIST: " + distLabel;
        }

        // Aggiorna quando usi lo zoom
        map.on('zoomend', updateUI);

        function trovaPosizione() {
            map.locate({setView: true, maxZoom: 18, enableHighAccuracy: true, watch: true});
        }

        map.on('locationfound', function(e) {
            if (userMarker) {
                userMarker.setLatLng(e.latlng);
                userCircle.setLatLng(e.latlng).setRadius(e.accuracy / 2);
                if (lastPos && e.accuracy < 25) {
                    var d = lastPos.distanceTo(e.latlng);
                    if (d > 3) { 
                        totalDist += d; 
                        trackLine.addLatLng(e.latlng); 
                    }
                }
            } else {
                userCircle = L.circle(e.latlng, {radius: e.accuracy / 2, color: '#007bff', opacity: 0.3}).addTo(map);
                userMarker = L.marker(e.latlng, {
                    icon: L.divIcon({
                        className: 'user-arrow',
                        html: '<svg width="34" height="34" viewBox="0 0 100 100"><path d="M50 0 L90 100 L50 75 L10 100 Z" fill="#007bff" stroke="white" stroke-width="5"/></svg>',
                        iconSize: [34, 34], iconAnchor: [17, 17]
                    })
                }).addTo(map);
            }
            lastPos = e.latlng;
            updateUI(); // Aggiorna i metri nel box

            if (window.alertOn) {
                checkAlert(e.latlng, 'geonode:aree_archeologiche', 'alert-archeo');
                checkAlert(e.latlng, 'geonode:ps_amb_aree_protette', 'alert-parchi');
            }
        });

        function checkAlert(latlng, layer, elementId) {
            var b = 0.0003; 
            var url = wmsLazio + "?service=WMS&request=GetFeatureInfo&version=1.1.1&layers=" + layer + "&query_layers=" + layer + "&info_format=application/json&x=50&y=50&width=101&height=101&bbox=" + (latlng.lng-b)+","+(latlng.lat-b)+","+(latlng.lng+b)+","+(latlng.lat+b);
            fetch(url).then(r => r.json()).then(d => { 
                document.getElementById(elementId).style.display = (d.features && d.features.length > 0) ? 'block' : 'none';
            }).catch(e => {});
        }

        window.alertOn = false;
        var Gui = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                var c = L.DomUtil.create('div', 'leaflet-bar');
                c.style.background = "white";
                c.innerHTML = '<div id="tA" style="padding:12px; cursor:pointer; border-bottom:1px solid #ccc; color:red; font-weight:bold;">🔔 Allerta: OFF</div><div id="tR" style="padding:12px; cursor:pointer;">🧹 Reset</div>';
                c.querySelector('#tA').onclick = function() { 
                    window.alertOn = !window.alertOn; 
                    this.innerHTML = window.alertOn ? "🔔 Allerta: ON" : "🔔 Allerta: OFF"; 
                    this.style.color = window.alertOn ? "green" : "red";
                };
                c.querySelector('#tR').onclick = function() { totalDist = 0; trackLine.setLatLngs([]); updateUI(); };
                return c;
            }
        });
        map.addControl(new Gui());
    </script>
</body>
</html>
