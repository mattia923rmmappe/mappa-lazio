<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ArcheoLazio Interactive PRO</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; }
        
        #info-box {
            position: absolute; bottom: 40px; left: 10px; z-index: 1000;
            background: rgba(0,0,0,0.85); color: #00ff00; padding: 12px;
            border-radius: 8px; font-size: 14px; border: 1px solid #00ff00;
            font-family: 'Courier New', monospace; pointer-events: none;
        }

        .gps-btn {
            position: absolute; bottom: 35px; right: 20px; z-index: 1000;
            background: white; width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 30px; border: 3px solid #007bff;
        }

        /* Animazione Punto Rosso Lampeggiante */
        .punto-archeo {
            background: #ff0000;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0000;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .alert-box {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 2000; padding: 12px; border-radius: 10px; text-align: center; 
            font-weight: bold; color: white; display: none; border: 2px solid white;
            background: #ff0000; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .popup-btn {
            display: block; width: 100%; margin-top: 5px; padding: 10px;
            border: none; border-radius: 4px; font-weight: bold; color: white;
            cursor: pointer; text-decoration: none; text-align: center; font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="alert-archeo" class="alert-box">⚠️ AREA ARCHEOLOGICA RILEVATA</div>

    <div id="info-box">ZOOM: 11<br>DIST: 0 m</div>
    
    <div id="map"></div>
    <div class="gps-btn" onclick="trovaPosizione()">📍</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script>
        var map = L.map('map', { center: [41.9028, 12.4964], zoom: 11, zoomControl: false });

        // LIVELLI
        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
        var wmsLazio = 'https://geoportale.regione.lazio.it/geoserver/wms';
        var areeArcheo = L.tileLayer.wms(wmsLazio, { layers: 'geonode:aree_archeologiche', format: 'image/png', transparent: true, opacity: 0.4 }).addTo(map);

        // --- FUNZIONE CLICK E PUNTO ROSSO ---
        var tempMarker = null;

        map.on('click', function(e) {
            var size = map.getSize();
            var point = map.layerPointToContainerPoint(e.layerPoint);
            var bbox = map.getBounds().toBBoxString();

            var url = wmsLazio + "?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo&LAYERS=geonode:aree_archeologiche&QUERY_LAYERS=geonode:aree_archeologiche&INFO_FORMAT=application/json&X=" + Math.round(point.x) + "&Y=" + Math.round(point.y) + "&WIDTH=" + size.x + "&HEIGHT=" + size.y + "&BBOX=" + bbox;

            fetch(url).then(res => res.json()).then(data => {
                if (data.features && data.features.length > 0) {
                    var props = data.features[0].properties;
                    var nome = props.nome_sito || "Sito Archeologico";
                    
                    // Rimuovi punto precedente se esiste
                    if (tempMarker) map.removeLayer(tempMarker);

                    // Crea il PUNTO ROSSO
                    tempMarker = L.marker(e.latlng, {
                        icon: L.divIcon({ className: 'punto-archeo', iconSize: [20, 20] })
                    }).addTo(map);

                    var popupHtml = `
                        <div style="min-width:200px">
                            <b style="color:red; font-size:16px;">📍 ${nome}</b><br>
                            <hr>
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${e.latlng.lat},${e.latlng.lng}&travelmode=walking" target="_blank" class="popup-btn" style="background:#007bff;">🧭 PORTAMI QUI</a>
                            <a href="https://www.google.com/search?tbm=isch&q=reperti+archeologici+${encodeURIComponent(nome)}" target="_blank" class="popup-btn" style="background:#f39c12;">🖼️ VEDI FOTO REPERTI</a>
                            <a href="https://www.google.com/search?q=${encodeURIComponent(nome)}+storia" target="_blank" class="popup-btn" style="background:#333;">📖 LEGGI STORIA</a>
                        </div>
                    `;
                    tempMarker.bindPopup(popupHtml).openPopup();
                }
            });
        });

        // --- GPS E ICONA DETECTOR ---
        var totalDist = 0, lastPos = null;
        var userMarker, userCircle;

        var detectorIcon = L.divIcon({
            className: 'detector-icon',
            html: `<svg width="40" height="40" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="#fbff00" stroke-width="6" fill="rgba(251, 255, 0, 0.2)" /><line x1="50" y1="10" x2="50" y2="90" stroke="#fbff00" stroke-width="4" /><line x1="10" y1="50" x2="90" y2="50" stroke="#fbff00" stroke-width="4" /><circle cx="50" cy="50" r="5" fill="#fbff00" /><path d="M50 5 L60 20 L40 20 Z" fill="#fbff00" /></svg>`,
            iconSize: [40, 40], iconAnchor: [20, 20]
        });

        function updateUI() {
            document.getElementById('info-box').innerHTML = "ZOOM: " + map.getZoom() + "<br>DIST: " + Math.round(totalDist) + " m";
        }
        map.on('zoomend', updateUI);

        function trovaPosizione() {
            map.locate({setView: true, maxZoom: 18, enableHighAccuracy: true, watch: true});
        }

        window.addEventListener('deviceorientationabsolute', function(e) {
            var alpha = e.alpha || e.webkitCompassHeading;
            if (alpha !== null && userMarker) {
                var el = userMarker.getElement();
                if (el) el.style.transform = el.style.transform.replace(/rotateZ\(.*?\)/, '') + ' rotateZ(' + (360 - alpha) + 'deg)';
            }
        }, true);

        map.on('locationfound', function(e) {
            if (!userMarker) {
                userCircle = L.circle(e.latlng, {radius: 10, color: '#007bff', opacity: 0.2}).addTo(map);
                userMarker = L.marker(e.latlng, {icon: detectorIcon}).addTo(map);
            } else {
                userMarker.setLatLng(e.latlng);
                userCircle.setLatLng(e.latlng);
                if (lastPos) totalDist += lastPos.distanceTo(e.latlng);
            }
            lastPos = e.latlng;
            updateUI();
            
            // Allerta automatica
            checkAlert(e.latlng);
        });

        function checkAlert(latlng) {
            var b = 0.0003; 
            var url = wmsLazio + "?service=WMS&request=GetFeatureInfo&version=1.1.1&layers=geonode:aree_archeologiche&query_layers=geonode:aree_archeologiche&info_format=application/json&x=50&y=50&width=101&height=101&bbox=" + (latlng.lng-b)+","+(latlng.lat-b)+","+(latlng.lng+b)+","+(latlng.lat+b);
            fetch(url).then(r => r.json()).then(d => { 
                document.getElementById('alert-archeo').style.display = (d.features && d.features.length > 0) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
